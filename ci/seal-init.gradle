// Seal CI init script, shared by .travis.yml (tests) and .github/workflows/seal-build.yml (jar).
// error-prone (inside compileJava) and checkstyle stay as upstream configures them.
// It only turns off jacoco (coverage reports), compiles the shipped bcutil classes with
// -g:none like the public release jar (no LineNumberTable/LocalVariableTable/SourceFile),
// keeps test stdout out of the log (Travis kills jobs over 4MB of output) and prints each
// test result plus a per-task summary.
allprojects { p ->
    p.afterEvaluate {
        p.tasks.withType(org.gradle.testing.jacoco.tasks.JacocoReport).configureEach { enabled = false }
        if (p.path == ':util') {
            p.tasks.matching { it.name in ['compileJava', 'compileJava9Java'] }.configureEach { t ->
                t.options.debug = false
            }
        }
        p.tasks.withType(Test).configureEach { t ->
            def jc = t.extensions.findByName('jacoco')
            if (jc != null) {
                jc.enabled = false
            }
            t.testLogging {
                showStandardStreams = false
                events 'passed', 'skipped', 'failed'
                exceptionFormat 'full'
            }
            t.afterSuite { desc, result ->
                if (desc.parent == null) {
                    println("TEST SUMMARY ${t.path}: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
                }
            }
        }
    }
}
